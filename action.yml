name: Apideck QuickBooks Review Check
description: 'Free self-check for the QuickBooks Online app security review: probes your deployed app and scans your code.'
author: Apideck
branding:
  icon: shield
  color: purple

inputs:
  url:
    description: 'Base URL of the deployed app (runtime checks). Leave empty to only scan source.'
    required: false
  callback:
    description: 'OAuth redirect URI path, e.g. /oauth/callback'
    required: false
  paths:
    description: 'Newline-separated sensitive paths to check for no-store caching'
    required: false
  headers:
    description: 'Newline-separated extra headers ("Cookie: session=…"); pass secrets from the secrets context'
    required: false
  source:
    description: 'Directory to scan for token-handling issues. Set to "" to skip.'
    required: false
    default: "."
  fail-on:
    description: 'fail | warn | never'
    required: false
    default: fail

outputs:
  report:
    description: 'Path to the Markdown report'
    value: ${{ steps.run.outputs.report }}
  report-json:
    description: 'Path to the JSON report'
    value: ${{ steps.run.outputs.report-json }}
  failed:
    description: 'Number of failed checks'
    value: ${{ steps.run.outputs.failed }}
  warnings:
    description: 'Number of warnings'
    value: ${{ steps.run.outputs.warnings }}
  passed:
    description: 'Number of passed checks'
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - id: run
      shell: bash
      env:
        QBRC_URL: ${{ inputs.url }}
        QBRC_CALLBACK: ${{ inputs.callback }}
        QBRC_PATHS: ${{ inputs.paths }}
        QBRC_HEADERS: ${{ inputs.headers }}
        QBRC_SOURCE: ${{ inputs.source }}
        QBRC_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        md="$RUNNER_TEMP/quickbooks-review.md"
        json="$RUNNER_TEMP/quickbooks-review.json"
        args=(--fail-on "$QBRC_FAIL_ON" --markdown "$md" --json "$json")
        [ -n "$QBRC_URL" ] && args+=(--url "$QBRC_URL")
        [ -n "$QBRC_CALLBACK" ] && args+=(--callback "$QBRC_CALLBACK")
        [ -n "$QBRC_SOURCE" ] && args+=(--source "$QBRC_SOURCE")
        while IFS= read -r p; do [ -n "$p" ] && args+=(--path "$p"); done <<< "$QBRC_PATHS"
        while IFS= read -r h; do [ -n "$h" ] && args+=(--header "$h"); done <<< "$QBRC_HEADERS"
        echo "report=$md" >> "$GITHUB_OUTPUT"
        echo "report-json=$json" >> "$GITHUB_OUTPUT"
        status=0
        node "$GITHUB_ACTION_PATH/bin/quickbooks-review-check.js" "${args[@]}" || status=$?
        # Counts are written even when the check fails, so later steps can use them.
        node -e "const s=require(process.argv[1]).summary; for (const [k,v] of [['failed',s.fail],['warnings',s.warn],['passed',s.pass]]) console.log(k+'='+v)" "$json" >> "$GITHUB_OUTPUT"
        exit $status
